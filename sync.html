<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>NoVNC 同步器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #1a1f2e;
      color: #e0e6f0;
      font-size: 13px;
      overflow-y: auto;
    }
    .header {
      background: linear-gradient(135deg, #2d3548, #1e2538);
      padding: 16px 20px;
      border-bottom: 1px solid #33475f;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 16px; color: #ffcc66; font-weight: 600; }
    .header .status {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 10px;
      background: #33475f;
      color: #8a9bb5;
    }
    .header .status.active { background: #1a472a; color: #4caf50; }
    .toolbar {
      padding: 12px 20px;
      display: flex;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid #252d3d;
    }
    .btn {
      padding: 6px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: all 0.2s;
    }
    .btn-scan { background: #3b82f6; color: #fff; }
    .btn-scan:hover { background: #2563eb; }
    .btn-scan:disabled { background: #4a5568; cursor: not-allowed; }
    .btn-start { background: #22c55e; color: #fff; }
    .btn-start:hover { background: #16a34a; }
    .btn-start:disabled { background: #4a5568; cursor: not-allowed; }
    .btn-stop { background: #ef4444; color: #fff; }
    .btn-stop:hover { background: #dc2626; }
    .btn-stop:disabled { background: #4a5568; cursor: not-allowed; }
    .scan-info { font-size: 11px; color: #8a9bb5; }
    .content { padding: 12px 20px; }

    .client-group {
      margin-bottom: 16px;
      border: 1px solid #2d3548;
      border-radius: 6px;
      overflow: hidden;
    }
    .client-header {
      background: #252d3d;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .client-header .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-ok { background: #4caf50; }
    .dot-err { background: #ef4444; }
    .client-header .name { color: #ffcc66; }
    .client-header .api-url { color: #6b7fa3; font-size: 11px; font-weight: 400; }
    .client-body { padding: 6px 0; }

    .ip-row {
      display: flex;
      align-items: center;
      padding: 6px 14px;
      gap: 10px;
      transition: background 0.15s;
    }
    .ip-row:hover { background: #222b3d; }
    .ip-row.disabled { opacity: 0.4; }

    .ip-row .col-master {
      width: 60px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #8a9bb5;
    }
    .ip-row .col-master input[type="radio"] { accent-color: #ffcc66; }

    .ip-row .col-ctrl {
      width: 50px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #8a9bb5;
    }
    .ip-row .col-ctrl input[type="checkbox"] { accent-color: #22c55e; }

    .ip-row .col-ip {
      flex: 1;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 13px;
      color: #c8d6e5;
    }
    .ip-row .col-title {
      width: 140px;
      font-size: 12px;
      color: #8a9bb5;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ip-row .col-status {
      width: 50px;
      font-size: 11px;
    }
    .status-alive { color: #4caf50; }
    .status-dead { color: #ef4444; }

    .ip-row.is-master .col-ip { color: #ffcc66; font-weight: 600; }
    .ip-row.is-master .col-title { color: #ffcc66; }
    .ip-row.is-controlled .col-ip { color: #22c55e; }
    .ip-row.is-controlled .col-title { color: #22c55e; }

    .legend {
      display: flex;
      gap: 20px;
      padding: 8px 14px;
      font-size: 11px;
      color: #6b7fa3;
      border-top: 1px solid #252d3d;
      padding-top: 12px;
      margin-top: 8px;
    }
    .legend span { display: flex; align-items: center; gap: 4px; }
    .legend .master-dot { width: 8px; height: 8px; border-radius: 50%; background: #ffcc66; }
    .legend .ctrl-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }

    .log-area {
      margin-top: 12px;
      border-top: 1px solid #252d3d;
      padding-top: 12px;
    }
    .log-area h3 { font-size: 12px; color: #8a9bb5; margin-bottom: 6px; }
    .log-box {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 4px;
      padding: 8px;
      height: 120px;
      overflow-y: auto;
      font-family: "Consolas", monospace;
      font-size: 11px;
      color: #8b949e;
      line-height: 1.5;
    }
    .log-box .log-ok { color: #4caf50; }
    .log-box .log-err { color: #ef4444; }
    .log-box .log-warn { color: #ffcc66; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #6b7fa3;
    }
    .empty-state p { margin: 8px 0; font-size: 13px; }
    .empty-state .icon { font-size: 36px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>NoVNC 同步器</h1>
    <span class="status" id="syncStatus">未连接</span>
  </div>

  <div class="toolbar">
    <button class="btn btn-scan" id="btnScan" onclick="doScan()">扫描客户端</button>
    <button class="btn btn-start" id="btnStart" onclick="doStart()" disabled>开始同步</button>
    <button class="btn btn-stop" id="btnStop" onclick="doStop()" disabled>停止同步</button>
    <span class="scan-info" id="scanInfo"></span>
  </div>

  <div class="content" id="content">
    <div class="empty-state">
      <div class="icon">&#128269;</div>
      <p>点击"扫描客户端"获取群控端信息</p>
      <p style="font-size:11px; color:#4a5568;">需要先在配置文件中设置群控客户端的API地址</p>
    </div>
  </div>

  <div class="log-area" style="padding: 0 20px 16px;">
    <h3>日志</h3>
    <div class="log-box" id="logBox"></div>
  </div>

  <script>
    let scanData = []
    let ipMapping = {}
    let syncActive = false

    function log (msg, type = '') {
      const box = document.getElementById('logBox')
      const line = document.createElement('div')
      line.className = type ? 'log-' + type : ''
      const now = new Date()
      const ts = [now.getHours(), now.getMinutes(), now.getSeconds()].map(n => String(n).padStart(2, '0')).join(':')
      line.textContent = `[${ts}] ${msg}`
      box.appendChild(line)
      box.scrollTop = box.scrollHeight
    }

    function updateStatus (text, active) {
      const el = document.getElementById('syncStatus')
      el.textContent = text
      el.className = 'status' + (active ? ' active' : '')
    }

    async function doScan () {
      const btn = document.getElementById('btnScan')
      btn.disabled = true
      btn.textContent = '扫描中...'
      log('开始扫描群控客户端...')
      try {
        scanData = await window.syncAPI.scanClients()
        if (scanData.error) {
          log('配置错误: ' + scanData.error, 'err')
          btn.disabled = false
          btn.textContent = '扫描客户端'
          return
        }
        // 构建IP映射
        ipMapping = {}
        let totalWindows = 0
        let okClients = 0
        for (const client of scanData) {
          if (client.error) {
            log(`${client.name}: ${client.error}`, 'err')
            continue
          }
          okClients++
          for (const win of client.windows) {
            if (win.controlIP) {
              ipMapping[win.controlIP] = {
                clientUrl: client.apiUrl,
                windowIndex: win.index,
                title: win.title,
                alive: win.alive,
                clientName: client.name
              }
              totalWindows++
            }
          }
          log(`${client.name}: ${client.windows.length}个窗口`, 'ok')
        }
        log(`扫描完成: ${okClients}/${scanData.length}个客户端在线, ${totalWindows}个窗口`, 'ok')
        document.getElementById('scanInfo').textContent = `${okClients}/${scanData.length} 在线 | ${totalWindows} 窗口`
        renderList()
        document.getElementById('btnStart').disabled = !okClients
      } catch (e) {
        log('扫描失败: ' + e.message, 'err')
      }
      btn.disabled = false
      btn.textContent = '扫描客户端'
    }

    function renderList () {
      const content = document.getElementById('content')
      if (!scanData.length) {
        content.innerHTML = '<div class="empty-state"><div class="icon">&#128269;</div><p>无数据</p></div>'
        return
      }

      let html = ''
      for (const client of scanData) {
        const isOk = !client.error
        html += `<div class="client-group">`
        html += `<div class="client-header">`
        html += `<span class="dot ${isOk ? 'dot-ok' : 'dot-err'}"></span>`
        html += `<span class="name">${client.name}</span>`
        html += `<span class="api-url">${client.apiUrl}</span>`
        if (client.error) html += `<span style="color:#ef4444;font-size:11px;"> - ${client.error}</span>`
        if (client.groupName) html += `<span style="color:#8a9bb5;font-size:11px;"> - ${client.groupName}</span>`
        html += `</div>`

        if (isOk && client.windows.length) {
          html += `<div class="client-body">`
          for (const win of client.windows) {
            const ip = win.controlIP || '-'
            const alive = win.alive
            const cls = alive ? '' : ' disabled'
            html += `<div class="ip-row${cls}" data-ip="${ip}">`
            html += `<div class="col-master"><input type="radio" name="master" value="${ip}" ${alive ? '' : 'disabled'} onchange="onMasterChange(this.value)"> 主控</div>`
            html += `<div class="col-ctrl"><input type="checkbox" value="${ip}" ${alive ? '' : 'disabled'} onchange="onCtrlChange()"> 被控</div>`
            html += `<div class="col-ip">${ip}</div>`
            html += `<div class="col-title" title="${win.title}">${win.title}</div>`
            html += `<div class="col-status ${alive ? 'status-alive' : 'status-dead'}">${alive ? '在线' : '离线'}</div>`
            html += `</div>`
          }
          html += `</div>`
        } else if (!isOk) {
          html += `<div class="client-body"><div class="ip-row disabled"><div style="color:#6b7fa3;padding:6px 14px;">连接失败</div></div></div>`
        }
        html += `</div>`
      }

      html += `<div class="legend">`
      html += `<span><span class="master-dot"></span> 主控 - 操作来源</span>`
      html += `<span><span class="ctrl-dot"></span> 被控 - 接收操作</span>`
      html += `</div>`

      content.innerHTML = html
    }

    function onMasterChange (ip) {
      // 高亮主控和被控
      document.querySelectorAll('.ip-row').forEach(row => {
        row.classList.remove('is-master', 'is-controlled')
      })
      const masterRow = document.querySelector(`.ip-row[data-ip="${ip}"]`)
      if (masterRow) masterRow.classList.add('is-master')

      // 被控的高亮
      document.querySelectorAll('.col-ctrl input:checked').forEach(cb => {
        const row = cb.closest('.ip-row')
        if (row && cb.value !== ip) row.classList.add('is-controlled')
      })

      updateStartButton()
    }

    function onCtrlChange () {
      const masterRadio = document.querySelector('input[name="master"]:checked')
      const masterIP = masterRadio ? masterRadio.value : ''

      document.querySelectorAll('.ip-row').forEach(row => {
        row.classList.remove('is-master', 'is-controlled')
      })
      if (masterIP) {
        const masterRow = document.querySelector(`.ip-row[data-ip="${masterIP}"]`)
        if (masterRow) masterRow.classList.add('is-master')
      }

      document.querySelectorAll('.col-ctrl input:checked').forEach(cb => {
        const row = cb.closest('.ip-row')
        if (row) row.classList.add('is-controlled')
      })

      updateStartButton()
    }

    function updateStartButton () {
      const masterRadio = document.querySelector('input[name="master"]:checked')
      const ctrlChecks = document.querySelectorAll('.col-ctrl input:checked')
      document.getElementById('btnStart').disabled = !masterRadio || ctrlChecks.length === 0
    }

    async function doStart () {
      const masterRadio = document.querySelector('input[name="master"]:checked')
      if (!masterRadio) return

      const masterIP = masterRadio.value
      const ctrlChecks = document.querySelectorAll('.col-ctrl input:checked')
      const controlledIPs = Array.from(ctrlChecks).map(cb => cb.value)

      if (controlledIPs.length === 0) {
        log('请至少选择一个被控IP', 'warn')
        return
      }

      const masterAlsoControlled = controlledIPs.includes(masterIP)
      log(`开始同步: 主控=${masterIP}, 被控=[${controlledIPs.join(', ')}]${masterAlsoControlled ? ' (主控也接收同步)' : ''}`)

      try {
        const result = await window.syncAPI.startSync({
          masterIP,
          controlledIPs
        })
        if (result.error) {
          log('启动失败: ' + result.error, 'err')
          return
        }
        syncActive = true
        updateStatus('同步中', true)
        document.getElementById('btnStart').disabled = true
        document.getElementById('btnStop').disabled = false
        document.getElementById('btnScan').disabled = true
        log('同步已启动，主控VNC窗口已打开', 'ok')
      } catch (e) {
        log('启动异常: ' + e.message, 'err')
      }
    }

    async function doStop () {
      try {
        await window.syncAPI.stopSync()
      } catch (e) {}
      syncActive = false
      updateStatus('已停止', false)
      document.getElementById('btnStart').disabled = false
      document.getElementById('btnStop').disabled = true
      document.getElementById('btnScan').disabled = false
      log('同步已停止', 'warn')
    }

    // 监听同步停止事件（主控窗口关闭等）
    window.syncAPI.onSyncStopped(() => {
      syncActive = false
      updateStatus('已停止', false)
      document.getElementById('btnStart').disabled = false
      document.getElementById('btnStop').disabled = true
      document.getElementById('btnScan').disabled = false
      log('主控窗口关闭，同步已停止', 'warn')
    })

    window.syncAPI.onMasterFocused(() => {
      log('主控窗口获得焦点', 'ok')
    })

    // 页面加载完自动扫描一次
    window.addEventListener('DOMContentLoaded', () => {
      log('同步器已启动')
      setTimeout(doScan, 500)
    })
  </script>
</body>
</html>
