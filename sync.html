<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>NoVNC 同步器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #1a1f2e;
      color: #e0e6f0;
      font-size: 12px;
      overflow-y: hidden;
    }
    .header {
      background: linear-gradient(135deg, #2d3548, #1e2538);
      padding: 12px 16px;
      border-bottom: 1px solid #33475f;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 15px; color: #ffcc66; font-weight: 600; }
    .header .status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #33475f;
      color: #8a9bb5;
    }
    .header .status.active { background: #1a472a; color: #4caf50; }

    .toolbar {
      padding: 8px 16px;
      display: flex;
      gap: 6px;
      align-items: center;
      border-bottom: 1px solid #252d3d;
      flex-wrap: wrap;
    }
    .btn {
      padding: 4px 12px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
      transition: all 0.2s;
    }
    .btn-scan { background: #3b82f6; color: #fff; }
    .btn-scan:hover { background: #2563eb; }
    .btn-scan:disabled { background: #4a5568; cursor: not-allowed; }
    .btn-start { background: #22c55e; color: #fff; }
    .btn-start:hover { background: #16a34a; }
    .btn-start:disabled { background: #4a5568; cursor: not-allowed; }
    .btn-stop { background: #ef4444; color: #fff; }
    .btn-stop:hover { background: #dc2626; }
    .btn-stop:disabled { background: #4a5568; cursor: not-allowed; }
    .btn-sm { background: #374151; color: #c8d6e5; padding: 2px 8px; font-size: 10px; }
    .btn-sm:hover { background: #4b5563; }
    .btn-sm-all { background: #1e3a5f; color: #60a5fa; padding: 2px 8px; font-size: 10px; }
    .btn-sm-all:hover { background: #1e4976; }
    .scan-info { font-size: 10px; color: #8a9bb5; margin-left: auto; }

    .groups-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 6px 8px;
    }

    .client-group {
      border: 1px solid #2d3548;
      border-radius: 5px;
      overflow: hidden;
      background: #1e2538;
    }
    .client-header {
      background: #252d3d;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
    }
    .client-header .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-ok { background: #4caf50; }
    .dot-err { background: #ef4444; }
    .client-header .name { color: #ffcc66; }
    .client-header .group-btns {
      margin-left: auto;
      display: flex;
      gap: 4px;
    }

    .client-body { padding: 2px 0; }

    .ip-row {
      display: flex;
      align-items: center;
      padding: 2px 8px;
      gap: 4px;
      transition: background 0.15s;
    }
    .ip-row:hover { background: #222b3d; }
    .ip-row.disabled { opacity: 0.4; }

    .ip-row .col-master {
      width: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    .ip-row .col-master input[type="radio"] {
      accent-color: #ffcc66;
      width: 11px; height: 11px;
      cursor: pointer;
    }

    .ip-row .col-ctrl {
      width: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    .ip-row .col-ctrl input[type="checkbox"] {
      accent-color: #22c55e;
      width: 11px; height: 11px;
      cursor: pointer;
    }

    .ip-row .col-ip {
      font-family: "Consolas", "Courier New", monospace;
      font-size: 10px;
      color: #c8d6e5;
      width: 95px;
      flex-shrink: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ip-row .col-title {
      font-size: 10px;
      color: #6b7fa3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }

    .ip-row.is-master .col-ip { color: #ffcc66; font-weight: 600; }
    .ip-row.is-master .col-title { color: #ffcc66; }
    .ip-row.is-controlled .col-ip { color: #22c55e; }
    .ip-row.is-controlled .col-title { color: #22c55e; }

    .log-area {
      border-top: 1px solid #252d3d;
      padding: 6px 12px 10px;
    }
    .log-area h3 { font-size: 11px; color: #8a9bb5; margin-bottom: 4px; }
    .log-box {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 3px;
      padding: 6px;
      height: 80px;
      overflow-y: auto;
      font-family: "Consolas", monospace;
      font-size: 10px;
      color: #8b949e;
      line-height: 1.4;
    }
    .log-box .log-ok { color: #4caf50; }
    .log-box .log-err { color: #ef4444; }
    .log-box .log-warn { color: #ffcc66; }

    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: #6b7fa3;
      grid-column: 1 / -1;
    }
    .empty-state p { margin: 6px 0; font-size: 12px; }
    .empty-state .icon { font-size: 28px; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>NoVNC 同步器</h1>
    <span class="status" id="syncStatus">未连接</span>
  </div>

  <div class="toolbar">
    <button class="btn btn-scan" id="btnScan" onclick="doScan()">扫描</button>
    <button class="btn btn-start" id="btnStart" onclick="doStart()" disabled>开始同步</button>
    <button class="btn btn-stop" id="btnStop" onclick="doStop()" disabled>停止</button>
    <span style="width:1px;height:16px;background:#33475f;margin:0 4px;"></span>
    <button class="btn btn-sm-all" onclick="selectAll()">全选被控</button>
    <button class="btn btn-sm" onclick="deselectAll()">取消全选</button>
    <span class="scan-info" id="scanInfo"></span>
  </div>

  <div class="groups-grid" id="content">
    <div class="empty-state">
      <div class="icon">&#128269;</div>
      <p>点击"扫描"获取群控端信息</p>
      <p style="font-size:10px; color:#4a5568;">需要先在配置文件中设置群控客户端的API地址</p>
    </div>
  </div>

  <div class="log-area">
    <h3>日志</h3>
    <div class="log-box" id="logBox"></div>
  </div>

  <script>
    let scanData = []
    let ipMapping = {}
    let syncActive = false

    function log (msg, type = '') {
      const box = document.getElementById('logBox')
      const line = document.createElement('div')
      line.className = type ? 'log-' + type : ''
      const now = new Date()
      const ts = [now.getHours(), now.getMinutes(), now.getSeconds()].map(n => String(n).padStart(2, '0')).join(':')
      line.textContent = `[${ts}] ${msg}`
      box.appendChild(line)
      box.scrollTop = box.scrollHeight
    }

    function updateStatus (text, active) {
      const el = document.getElementById('syncStatus')
      el.textContent = text
      el.className = 'status' + (active ? ' active' : '')
    }

    async function doScan () {
      const btn = document.getElementById('btnScan')
      btn.disabled = true
      btn.textContent = '扫描中...'
      log('开始扫描群控客户端...')
      try {
        scanData = await window.syncAPI.scanClients()
        if (scanData.error) {
          log('配置错误: ' + scanData.error, 'err')
          btn.disabled = false
          btn.textContent = '扫描'
          return
        }
        ipMapping = {}
        let totalWindows = 0
        let okClients = 0
        for (const client of scanData) {
          if (client.error) {
            log(`${client.name}: ${client.error}`, 'err')
            continue
          }
          okClients++
          for (const win of client.windows) {
            if (win.controlIP) {
              ipMapping[win.controlIP] = {
                clientUrl: client.apiUrl,
                windowIndex: win.index,
                title: win.title,
                alive: win.alive,
                clientName: client.name
              }
              totalWindows++
            }
          }
          log(`${client.name}: ${client.windows.length}个窗口`, 'ok')
        }
        log(`扫描完成: ${okClients}/${scanData.length}个客户端在线, ${totalWindows}个窗口`, 'ok')
        document.getElementById('scanInfo').textContent = `${okClients}/${scanData.length} 在线 | ${totalWindows} 窗口`
        renderList()
        document.getElementById('btnStart').disabled = !okClients
      } catch (e) {
        log('扫描失败: ' + e.message, 'err')
      }
      btn.disabled = false
      btn.textContent = '扫描'
    }

    function renderList () {
      const content = document.getElementById('content')
      if (!scanData.length) {
        content.innerHTML = '<div class="empty-state"><div class="icon">&#128269;</div><p>无数据</p></div>'
        return
      }

      let html = ''
      for (const client of scanData) {
        const isOk = !client.error
        html += `<div class="client-group">`
        html += `<div class="client-header">`
        html += `<span class="dot ${isOk ? 'dot-ok' : 'dot-err'}"></span>`
        html += `<span class="name">${client.name}</span>`
        if (client.error) html += `<span style="color:#ef4444;font-size:10px;">${client.error}</span>`
        if (isOk) {
          html += `<div class="group-btns">`
          html += `<button class="btn btn-sm-all" onclick="selectGroup(this)">全选</button>`
          html += `<button class="btn btn-sm" onclick="deselectGroup(this)">取消</button>`
          html += `</div>`
        }
        html += `</div>`

        if (isOk && client.windows.length) {
          html += `<div class="client-body">`
          for (const win of client.windows) {
            const ip = win.controlIP || '-'
            const alive = win.alive
            const cls = alive ? '' : ' disabled'
            html += `<div class="ip-row${cls}" data-ip="${ip}" data-client="${client.name}">`
            html += `<div class="col-master"><input type="radio" name="master" value="${ip}" ${alive ? '' : 'disabled'} onchange="onMasterChange()"></div>`
            html += `<div class="col-ctrl"><input type="checkbox" value="${ip}" ${alive ? '' : 'disabled'} onchange="onCtrlChange()"></div>`
            html += `<div class="col-ip">${ip}</div>`
            html += `<div class="col-title" title="${win.title}">${win.title}</div>`
            html += `</div>`
          }
          html += `</div>`
        } else if (!isOk) {
          html += `<div class="client-body"><div style="color:#6b7fa3;padding:4px 10px;font-size:10px;">连接失败</div></div>`
        }
        html += `</div>`
      }

      content.innerHTML = html

      // ★ 渲染完后自动调整窗口高度适配内容
      requestAnimationFrame(() => {
        const h = document.documentElement.scrollHeight
        if (window.syncAPI && window.syncAPI.resizeToFit) {
          window.syncAPI.resizeToFit(h)
        }
      })
    }

    // ★ 一键选中某一组的全部被控
    function selectGroup (btn) {
      const group = btn.closest('.client-group')
      group.querySelectorAll('.col-ctrl input[type="checkbox"]').forEach(cb => {
        if (!cb.disabled) cb.checked = true
      })
      onCtrlChange()
    }

    // ★ 一键取消某一组的全部被控
    function deselectGroup (btn) {
      const group = btn.closest('.client-group')
      group.querySelectorAll('.col-ctrl input[type="checkbox"]').forEach(cb => {
        cb.checked = false
      })
      onCtrlChange()
    }

    // ★ 全选所有被控
    function selectAll () {
      document.querySelectorAll('.col-ctrl input[type="checkbox"]').forEach(cb => {
        if (!cb.disabled) cb.checked = true
      })
      onCtrlChange()
    }

    // ★ 取消全选所有被控
    function deselectAll () {
      document.querySelectorAll('.col-ctrl input[type="checkbox"]').forEach(cb => {
        cb.checked = false
      })
      onCtrlChange()
    }

    function onMasterChange () {
      const masterRadio = document.querySelector('input[name="master"]:checked')
      const masterIP = masterRadio ? masterRadio.value : ''

      document.querySelectorAll('.ip-row').forEach(row => {
        row.classList.remove('is-master', 'is-controlled')
      })
      if (masterIP) {
        const masterRow = document.querySelector(`.ip-row[data-ip="${masterIP}"]`)
        if (masterRow) masterRow.classList.add('is-master')
      }

      document.querySelectorAll('.col-ctrl input:checked').forEach(cb => {
        const row = cb.closest('.ip-row')
        if (row) row.classList.add('is-controlled')
      })

      updateStartButton()
    }

    function onCtrlChange () {
      const masterRadio = document.querySelector('input[name="master"]:checked')
      const masterIP = masterRadio ? masterRadio.value : ''

      document.querySelectorAll('.ip-row').forEach(row => {
        row.classList.remove('is-master', 'is-controlled')
      })
      if (masterIP) {
        const masterRow = document.querySelector(`.ip-row[data-ip="${masterIP}"]`)
        if (masterRow) masterRow.classList.add('is-master')
      }

      document.querySelectorAll('.col-ctrl input:checked').forEach(cb => {
        const row = cb.closest('.ip-row')
        if (row) row.classList.add('is-controlled')
      })

      updateStartButton()
    }

    function updateStartButton () {
      const masterRadio = document.querySelector('input[name="master"]:checked')
      const ctrlChecks = document.querySelectorAll('.col-ctrl input:checked')
      document.getElementById('btnStart').disabled = !masterRadio || ctrlChecks.length === 0
    }

    async function doStart () {
      const masterRadio = document.querySelector('input[name="master"]:checked')
      if (!masterRadio) return

      const masterIP = masterRadio.value
      const ctrlChecks = document.querySelectorAll('.col-ctrl input:checked')
      const controlledIPs = Array.from(ctrlChecks).map(cb => cb.value)

      if (controlledIPs.length === 0) {
        log('请至少选择一个被控IP', 'warn')
        return
      }

      const masterAlsoControlled = controlledIPs.includes(masterIP)
      log(`开始同步: 主控=${masterIP}, 被控=${controlledIPs.length}个${masterAlsoControlled ? ' (含主控)' : ''}`)

      try {
        const result = await window.syncAPI.startSync({
          masterIP,
          controlledIPs
        })
        if (result.error) {
          log('启动失败: ' + result.error, 'err')
          return
        }
        syncActive = true
        updateStatus('同步中', true)
        document.getElementById('btnStart').disabled = true
        document.getElementById('btnStop').disabled = false
        document.getElementById('btnScan').disabled = true
        log('同步已启动，主控VNC窗口已打开', 'ok')
      } catch (e) {
        log('启动异常: ' + e.message, 'err')
      }
    }

    async function doStop () {
      try {
        await window.syncAPI.stopSync()
      } catch (e) {}
      syncActive = false
      updateStatus('已停止', false)
      document.getElementById('btnStart').disabled = false
      document.getElementById('btnStop').disabled = true
      document.getElementById('btnScan').disabled = false
      log('同步已停止', 'warn')
    }

    // 监听同步停止事件
    window.syncAPI.onSyncStopped(() => {
      syncActive = false
      updateStatus('已停止', false)
      document.getElementById('btnStart').disabled = false
      document.getElementById('btnStop').disabled = true
      document.getElementById('btnScan').disabled = false
      log('主控窗口关闭，同步已停止', 'warn')
    })

    window.syncAPI.onMasterFocused(() => {
      log('主控窗口获得焦点', 'ok')
    })

    // 页面加载完自动扫描一次
    window.addEventListener('DOMContentLoaded', () => {
      log('同步器已启动')
      setTimeout(doScan, 500)
    })
  </script>
</body>
</html>
